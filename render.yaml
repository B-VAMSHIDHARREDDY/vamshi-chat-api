services:
  - type: web
    name: vamshi-chat-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: OPENAI_MODEL
        value: gpt-3.5-turbo
      - key: MAX_TOKENS
        value: "512"
      - key: TEMPERATURE
        value: "0.7"
      - key: APP_ENV
        value: production
    healthCheckPath: /health
